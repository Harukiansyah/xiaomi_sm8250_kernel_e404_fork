name: Build RE404 Kernel with FinaSU Integration

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename (SM8250 Platform)'
        required: true
        default: 'munch'
        type: choice
        options:
          - munch
          - alioth
          - apollo
          - lmi
          - cmi
          - cas
          - umi
          - thyme
      build_manager:
        description: 'Compile FinaSU Userspace Daemon (ksud) and Manager APK'
        required: true
        default: true
        type: boolean

jobs:
  # Job 1: Compile FinaSU Userspace Daemon and Android Manager Application
  build-finasu-manager:
    name: Build FinaSU Manager & Daemon
    if: ${{ inputs.build_manager == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FinaSU Source Repository
        uses: actions/checkout@v4
        with:
          repository: LyraVoid/FinaSU
          fetch-depth: 1

      - name: Configure Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Rust Toolchain and Android Targets
        run: |
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk

      - name: Compile Userspace Daemon (ksud) and Manager APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          chmod +x build.sh
          ./build.sh ksud
          ./build.sh apk

      - name: Upload FinaSU Manager APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinaSU-Manager-Application
          path: |
            **/*.apk
            out/**/*.apk

  # Job 2: Integrate FinaSU Driver and Compile Linux 4.19 Kernel
  build-kernel:
    name: Compile RE404 Kernel (${{ inputs.device }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install Build Environment Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 device-tree-compiler

      - name: Integrate FinaSU Kernel Driver into Source Tree
        run: |
          # Remove legacy KernelSU implementation to prevent symbol conflicts
          rm -rf KernelSU drivers/kernelsu
          
          # Clone FinaSU repository and link kernel driver directory
          git clone --depth=1 https://github.com/LyraVoid/FinaSU.git FinaSU
          ln -sf ../FinaSU/kernel drivers/kernelsu
          
          # Register FinaSU driver in kernel build system (Makefile and Kconfig)
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Set Up Clang/LLVM Cross-Compilation Toolchain
        run: |
          mkdir -p $HOME/clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240429-release/Clang-19.0.0git-20240429.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/clang

      - name: Generate Kernel Configuration (Defconfig)
        run: |
          DEVICE="${{ inputs.device }}"
          
          # Resolve device-specific defconfig path
          if [ -f "arch/arm64/configs/vendor/${DEVICE}_defconfig" ]; then
            DEFCONFIG="vendor/${DEVICE}_defconfig"
          elif [ -f "arch/arm64/configs/${DEVICE}_defconfig" ]; then
            DEFCONFIG="${DEVICE}_defconfig"
          elif [ -f "arch/arm64/configs/vendor/xiaomi/${DEVICE}.config" ]; then
            DEFCONFIG="vendor/kona-perf_defconfig vendor/xiaomi/sm8250-common.config vendor/xiaomi/${DEVICE}.config"
          else
            DEFCONFIG=$(find arch/arm64/configs -name "*${DEVICE}*" | sed 's|arch/arm64/configs/||' | head -n 1)
          fi
          
          echo "Target Defconfig resolved to: $DEFCONFIG"
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

          export PATH="$HOME/clang/bin:$PATH"
          make O=out ARCH=arm64 $DEFCONFIG

          # Enable FinaSU and required filesystem configurations
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> out/.config
          echo "CONFIG_OVERLAY_FS=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

      - name: Execute Kernel Compilation
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package Flashable Archive via AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh

          # Copy compiled kernel image and device tree artifacts
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi

          [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          [ -f "out/arch/arm64/boot/dtb" ] && cp out/arch/arm64/boot/dtb AnyKernel3/
          [ -f "out/arch/arm64/boot/dtb.img" ] && cp out/arch/arm64/boot/dtb.img AnyKernel3/

          cd AnyKernel3
          zip -r9 "../RE404-FinaSU-${{ inputs.device }}-$(date +%Y%m%d).zip" * -x .git README.md *placeholder

      - name: Upload Flashable Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RE404-FinaSU-${{ inputs.device }}-Kernel-Package
          path: RE404-FinaSU-*.zip
          
